services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiresystem
      POSTGRES_PASSWORD: hiresystem
      POSTGRES_DB: hiresystem
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresystem -d hiresystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://hiresystem:hiresystem@postgres:5432/hiresystem?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
