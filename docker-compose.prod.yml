services:
  api:
    image: hiresystem-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      PORT: 3001
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-https://ai.midongtech.com/v1}
      SUB2API_API_KEY: ${SUB2API_API_KEY:?SUB2API_API_KEY must be set in .env}
      SUB2API_MODEL: ${SUB2API_MODEL:-gpt-5.5}
      SUB2API_REASONING_EFFORT: ${SUB2API_REASONING_EFFORT:-minimal}
      SUB2API_TIMEOUT_MS: ${SUB2API_TIMEOUT_MS:-120000}
      SUB2API_MAX_RETRIES: ${SUB2API_MAX_RETRIES:-1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"

  web:
    image: hiresystem-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
